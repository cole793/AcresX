<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Shared property report · AcresX</title>
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#e6ece8;color:#17231c;font:15px/1.5 Arial,Helvetica,sans-serif}
.shared-msg{max-width:560px;margin:48px auto;background:#fff;padding:28px;border-radius:14px;box-shadow:0 10px 32px #0002;box-sizing:border-box}
.shared-msg img{height:30px;width:auto;display:block;margin-bottom:16px}
.shared-msg h1{font-size:20px;margin:0 0 8px}.shared-msg p{margin:0;color:#4a5a50}
@media(max-width:600px){.shared-msg{margin:16px;padding:20px}}
</style>
</head>
<body>
<!-- Shown at /r/<token> (src/services/accounts.js). public/shared-report.js loads the report JSON
     from /api/shared/<token> and renders it read-only with public/property-report-v2.js. -->
<main id="sharedStatus" class="shared-msg" aria-live="polite">
<img src="/assets/acresx-logo.png" alt="AcresX">
<h1 id="sharedTitle">Loading the shared report…</h1>
<p id="sharedText">One moment.</p>
</main>
<script src="/report-branding.js"></script>
<script src="/score-core.js"></script>
<script src="/public-utilities.js"></script>
<script src="/property-tax.js"></script>
<script src="/property-report-v2.js"></script>
<script src="/report-pdf.js"></script>
<script src="/shared-report.js"></script>
</body>
</html>
