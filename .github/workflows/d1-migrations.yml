name: Apply D1 migrations

# Applies migrations/*.sql to the production D1 database (acresx-mls) that have not been applied
# yet. Run by hand only (Actions -> Apply D1 migrations -> Run workflow, on main), after the
# owner approves it. Never runs on a push, a pull request or a preview.
# Wrangler records applied migrations in the d1_migrations table; every migration here uses
# CREATE ... IF NOT EXISTS, so re-applying one is harmless.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acresx-d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: List pending migrations
        run: npx wrangler d1 migrations list acresx-mls --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply migrations
        run: npx wrangler d1 migrations apply acresx-mls --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
