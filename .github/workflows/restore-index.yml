name: Restore index and enable property actions
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-index.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore working index and add property actions
        run: |
          git show bf6f4c4d20c5d8e54f573616e483fba00a090ac9:public/index.html > public/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          tag='<script src="property-actions.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Restore dashboard and enable property actions" || exit 0
          git push
